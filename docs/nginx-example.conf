# Contoh konfigurasi Nginx untuk Examora.
#
# Nginx tidak membaca .htaccess. Blok "deny" di bawah WAJIB ada agar
# app/, config/, database/, storage/, dan views/ tidak dapat diakses
# langsung dari browser.
#
# Penyesuaian yang perlu dilakukan:
#   - server_name  : domain sekolah
#   - root         : lokasi folder aplikasi
#   - fastcgi_pass : sesuaikan versi PHP-FPM (php8.2 / php8.3)
#
# Setelah disalin ke /etc/nginx/sites-available/examora:
#   sudo ln -s /etc/nginx/sites-available/examora /etc/nginx/sites-enabled/examora
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name examora.sekolah.sch.id;

    root /var/www/examora;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Folder internal aplikasi tidak boleh diakses.
    location ~ ^/(app|config|database|storage|views)/ {
        deny all;
        return 404;
    }

    # Berkas konfigurasi dan penanda instalasi.
    location ~* /(install\.lock|config\.example\.php)$ {
        deny all;
        return 404;
    }

    # Berkas backup, log, dan lock tidak boleh diunduh.
    location ~* \.(sql|log|lock)$ {
        deny all;
        return 404;
    }

    # Berkas tersembunyi (kecuali .well-known untuk ACME).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Front controller: aplikasi memakai index.php?r=...
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # fallback bila socket berbeda, mis. php8.2-fpm.sock
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Header keamanan dasar (aplikasi juga mengirim sebagian header ini).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Cache aset statis.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    access_log /var/log/nginx/examora-access.log;
    error_log  /var/log/nginx/examora-error.log;
}
